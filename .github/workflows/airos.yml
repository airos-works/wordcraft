# Builds the air/OS package (x86_64) on every push to main and publishes it to
# the rolling "latest" release, with links in the README. The images build
# WordCraft themselves at the commit pinned in jmgasper/airos-ci
# apps/office.lock.json, which must be on main. The pipeline itself lives in
# jmgasper/airos-ci (apps/build-app-packages.sh, build_wordcraft).
name: air/OS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  airos:
    uses: jmgasper/airos-ci/.github/workflows/app.yml@main
    with:
      app: wordcraft
      repo-dir: wordcraft
      architectures: x86_64
    permissions:
      contents: write

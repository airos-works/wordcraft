# Builds the air/OS package (x86_64) on every push to haiku and publishes it to the rolling
# "latest" release, with links in the README; the image builds take it from the package pool.
# The pipeline itself lives in jmgasper/airos-ci (apps/build-app-packages.sh, build_wordcraft).
name: air/OS build

on:
  push:
    branches: [haiku]
  workflow_dispatch:

jobs:
  airos:
    uses: jmgasper/airos-ci/.github/workflows/app.yml@main
    with:
      app: wordcraft
      repo-dir: wordcraft
      architectures: x86_64
      publish-branch: haiku
    permissions:
      contents: write
